name: Course package check

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'scripts/check_course_package.py'
      - 'scripts/disclosure.py'
      - 'scripts/image_reduce.py'
      - 'scripts/quiz_parse.py'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'scripts/check_course_package.py'
      - 'scripts/disclosure.py'
      - 'scripts/image_reduce.py'
      - 'scripts/quiz_parse.py'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate opted-in course packages
        run: python scripts/check_course_package.py
      # Every quiz in modules/, not only the opted-in ones: the Moodle publisher
      # reads all of them, and a quiz it cannot parse blocks that course's publish.
      # Catching it here means the author finds out, not the publisher.
      - name: Parse every quiz
        run: python scripts/quiz_parse.py --check-all
