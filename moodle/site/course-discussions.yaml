# Row #10: which courses' discussion spaces are shared across organisations (spec 012, FR-015).
#
# Every course the publisher puts on Moodle gets one discussion forum,
# `ltct:<slug>:discussion`, in separate-groups mode: learners see only the posts of the
# groups they belong to, and every group in a course belongs to exactly one organisation
# (spec 002), so no organisation reads another's posts.
#
# A course listed here is SHARED instead (visible groups): every learner in it can read
# every post. List a course only when its partners have agreed to pool answers and the
# discussion carries no partner data, and say so in `why`, with the date.
#
# Only the maintainer edits this file. Never set sharing in course frontmatter, and never
# only by hand in Moodle: `site_config.py drift` reports a hand change, and `apply` (or the
# next publish) puts it back.
#
#   slug   the course's branch_slug() form, as in course/<slug> (spaces become hyphens)
#   why    who agreed, why it is safe, and when
rows: [10]
shared: []
