# Rows #8 and #15: courses open across organisations, cohort sync that keeps history, and the
# settings the organisation manager's profile hook depends on.

rows: [8, 15]
purpose: >-
  Shared courses are open across organisations (spec 002, research R3, amended 2026-10-02).
  A course or an activity may use groups for teaching, but groups never separate
  organisations; a course that must stay with one organisation is declared in
  org-courses.yaml and lives in that organisation's category instead. Cohort sync suspends someone who leaves a
  cohort rather than unenrolling them, so their grades and completion are kept. Profiles need
  a login, which is what makes local_ltuse's profile hook run, and core user fields such as
  country stay visible to everyone.
settings:
  - name: moodlecourse/groupmode
    value: 0
    why: >-
      New courses default to no groups, open across organisations (R3, FR-011).
      scripts/publish_moodle.py also sends groupmode 0 on every publish, and drift reports any
      ltct: course whose group mode is not 0. site_config.py refuses any other value here.
  - name: moodlecourse/groupmodeforce
    value: 0
    why: >-
      Not forced, so a course or an activity may still opt into groups for its own teaching
      reasons (FR-011). A forced group mode would wall the course forum.
  - name: enrol_cohort/unenrolaction
    value: 3
    why: >-
      3 is ENROL_EXT_REMOVED_SUSPENDNOROLES. Someone who leaves a cohort is suspended, not
      unenrolled, so their grades and completion are kept (US3-2), and they lose the cohort's
      role, so a manager removed from a managers cohort loses orgmanager (R7). At 0 history
      is lost; at 2 a removed manager keeps the role.
  - name: forceloginforprofiles
    value: 1
    why: >-
      user_can_view_profile() returns before any plugin callback when this is off, so the
      profile hook that scopes a manager to their own organisation's people would never run
      (R9, FR-007).
  - name: hiddenuserfields
    value: ""
    why: >-
      Empty, so country and every other core user field stays visible to everyone (FR-008,
      R5). A field listed here is hidden from anyone without
      moodle/course:viewhiddenuserfields.
