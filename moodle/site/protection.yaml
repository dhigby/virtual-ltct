# Row #26: identity protection for at-risk users (spec 016).
#
# Read only by scripts/site_config.py (contract: specs/016-identity-protection/contracts/
# declaration.md). This file declares the levels and which account fields each one withholds
# from people who are not entitled. It never names who is protected, their pseudonym or real
# identity, or which organisations have a minimum level: all of that is Moodle data, set on
# the site and recovered by the data restore, because declaring it would publish who is at
# risk (constitution III, FR-014). Apply stores this file in local_ltuse's config and touches
# no user.

rows: [26]
purpose: >-
  The same participation under less of a person's identity. Each level includes the ones
  before it. local_ltuse writes the protected display into the account itself, so every view,
  email, search and the app show it (research R1), and keeps the real values in its own table
  for the people entitled to see them (R5, R7).
levels: [none, email, firstname, pseudonym]
withhold:
  email: [maildisplay]
  firstname:
    - maildisplay
    - lastname
    - firstnamephonetic
    - lastnamephonetic
    - middlename
    - alternatename
    - picture
    - country
    - city
    - url
    - institution
    - department
    - phone1
    - phone2
    - address
    - idnumber
    - ltct_role                    # names the work, which is exactly the risk (R6)
    - ltct_exp_core_technical
    - ltct_exp_technology_domain
    - ltct_exp_core
    - ltct_exp_professional
    - ltct_exp_education
  pseudonym:
    - maildisplay
    - lastname
    - firstnamephonetic
    - lastnamephonetic
    - middlename
    - alternatename
    - picture
    - country
    - city
    - url
    - institution
    - department
    - phone1
    - phone2
    - address
    - idnumber
    - ltct_role
    - ltct_exp_core_technical
    - ltct_exp_technology_domain
    - ltct_exp_core
    - ltct_exp_professional
    - ltct_exp_education
    - firstname                    # the pseudonym replaces it
org_minimum_max: firstname         # a pseudonym is chosen per person, never per organisation (R12)
neutral_surname: "·"               # mandatory: names are not locked and core's edit form requires a surname (R4)
reconcile_minutes: 60              # db/tasks.php runs reconcile_protection hourly
why: >-
  #26 (spec 016, FR-001, FR-014): the levels and what each withholds are configuration and
  rebuild with the server (SC-006). ltct_org and ltct_certname are never withheld: blanking
  ltct_org would drop a learner from their cohort and courses (R11), and ltct_certname is the
  certificate's name (R10). The learner's own words (description, interests) are theirs (R6).
