# The Moodle release and the plugins the training system depends on.
# Settings live in settings/, roles in roles.yaml. See README.md for how to change any of it.

moodle:
  # $CFG->version of the release this declaration was verified against.
  # apply refuses a server older than this.
  requires: 2026042003.03
  release: "5.2.3+ (Build: 20260928)"

plugins:
  - component: local_ltuse
    version: 2026100203
    source:
      path: moodle/local_ltuse
    why: The publish endpoint and this applier. Pinned to the version.php stamp in this repo.

  # Row #3: SCORM 1.2, H5P and embedded video.
  - component: mod_scorm
    enabled: 1
    why: "#3 SCORM 1.2 packages."
  - component: mod_h5pactivity
    enabled: 1
    why: "#3 H5P items as activities."
  - component: filter_displayh5p
    enabled: "on"
    why: "#3 H5P embedded in pages."
  - component: filter_mediaplugin
    enabled: "on"
    why: "#3 turns a Vimeo link into an embedded player."
  - component: media_vimeo
    enabled: 1
    why: "#3 Vimeo is a trusted embed source."
  - component: media_videojs
    enabled: 1
    why: "#3 plays linked video files."

  # Row #25: push through the Moodle app, beside email. The Premium app plan allows
  # unlimited devices at a flat rate, so push stays within constitution IX.
  - component: message_airnotifier
    enabled: 1
    why: "#25 push notifications to the Moodle app; each learner can turn them off per notification."

  # Row #8: partner organisations, their cohorts and cohort sync (spec 002).
  - component: tool_dynamic_cohorts
    version: 2026031300
    source:
      url: https://marketplace.moodle.com/api/plugins/tool_dynamic_cohorts/versions/2026031300/download
      sha256: "c959d01def5d88b074a189ba8c423b054f7e4e97f2293d127a4ac901d76444b2"
    why: "#8 fills organisation cohorts from the organisation field. Verified on 5.2 by hand checks (spec 002 research R4); its own version.php still says supported = [404, 501]."
  - component: enrol_cohort
    enabled: 1
    why: "#8 #15 cohort sync enrols an organisation, and its managers, into a course with its group."
