# Rows #14 and #11: what the site team's administration tool relies on (spec 008).

rows: [14, 11]
purpose: >-
  scripts/ltct_admin.py brings learners on and keeps course mentors in step through
  local_ltuse's administration service. These are the settings it owns. The others it
  depends on stay where their specs declare them (enrol_cohort/unenrolaction in groups.yaml,
  tool_dynamic_cohorts/realtime in cohorts.yaml), and "ltct_admin.py check" refuses to run if
  any of them is wrong (research R13).
settings:
  - name: allowaccountssameemail
    value: 0
    why: >-
      A backstop for core's own account-creation paths (signup, Upload users,
      core_user_create_users), and what makes email login below unambiguous. The administration
      tool does not rely on it: its intake matches
      by email under a lock and never creates a second account for one address (research R2).
  - name: authloginviaemail
    value: 1
    why: >-
      Learners sign in with their email address. Nobody should have to remember the generated
      username an intake gives them (Doug, 2026-10-05). Core accepts an email only when one live
      account has it (lib/moodlelib.php, authenticate_user_login), which allowaccountssameemail
      above and the intake's own email match guarantee. On by default in 5.2; declared so drift
      catches it being turned off.
  - name: local_ltuse/coursementorsync
    value: 0
    why: >-
      Off until spec 016 narrows its course-mentor path, so that a course mentor sees a
      protected learner only when they share a mentor group in the course (plan decision 11,
      approved 2026-10-04).
      At 1, each learner's course mentors are enrolled as Course mentor in the courses they
      take and removed by event (research R10); at 0 the observers and the hourly reconcile do
      nothing, and one-course and cohort mentors can still be recorded. Instance checks turn
      it on in their own --site-dir copy only.
