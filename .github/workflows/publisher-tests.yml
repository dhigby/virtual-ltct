name: Publisher Tests

on:
  push:
    paths:
      - 'scripts/image_reduce.py'
      - 'scripts/moodle_*.py'
      - 'scripts/check_moodle_payload.py'
      - 'scripts/check_course_package.py'
      - 'scripts/publish_moodle.py'
      - 'scripts/disclosure.py'
      - 'scripts/cbc_wording.py'
      - 'moodle/site/badges.yaml'
      - 'moodle/site/settings/badges.yaml'
      # Spec 002 R11: the payload's placement reads these.
      - 'moodle/site/org-courses.yaml'
      - 'moodle/site/organisations.yaml'
      - 'publish-requirements.txt'
      - 'tests/test_image_reduce.py'
      - 'tests/test_payload_assets.py'
      - 'tests/test_payload_completion.py'
      - 'tests/test_payload_recognition.py'
      # Spec 007: each section's estimated-time line.
      - 'tests/test_payload_time_text.py'
      - 'competencies.yaml'
      - 'tests/test_publish_moodle.py'
      # Spec 012: the mentor-only marker and the course discussion in the payload.
      - 'scripts/site_config.py'
      - 'tests/test_disclosure_mentor_only.py'
      - 'tests/test_moodle_payload_discussion.py'
      - 'tests/fixtures/**'
      # Spec 008: the site team's administration tool.
      - 'scripts/ltct_admin.py'
      - 'scripts/admin_files.py'
      - 'tests/test_ltct_admin.py'
      - '.github/workflows/publisher-tests.yml'
  pull_request:
    paths:
      - 'scripts/image_reduce.py'
      - 'scripts/moodle_*.py'
      - 'scripts/check_moodle_payload.py'
      - 'scripts/check_course_package.py'
      - 'scripts/publish_moodle.py'
      - 'scripts/disclosure.py'
      - 'scripts/cbc_wording.py'
      - 'moodle/site/badges.yaml'
      - 'moodle/site/settings/badges.yaml'
      # Spec 002 R11: the payload's placement reads these.
      - 'moodle/site/org-courses.yaml'
      - 'moodle/site/organisations.yaml'
      - 'publish-requirements.txt'
      - 'tests/test_image_reduce.py'
      - 'tests/test_payload_assets.py'
      - 'tests/test_payload_completion.py'
      - 'tests/test_payload_recognition.py'
      # Spec 007: each section's estimated-time line.
      - 'tests/test_payload_time_text.py'
      - 'competencies.yaml'
      - 'tests/test_publish_moodle.py'
      # Spec 012: the mentor-only marker and the course discussion in the payload.
      - 'scripts/site_config.py'
      - 'tests/test_disclosure_mentor_only.py'
      - 'tests/test_moodle_payload_discussion.py'
      - 'tests/fixtures/**'
      # Spec 008: the site team's administration tool.
      - 'scripts/ltct_admin.py'
      - 'scripts/admin_files.py'
      - 'tests/test_ltct_admin.py'
      - '.github/workflows/publisher-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r publish-requirements.txt pytest
      - name: Unit tests for the publisher
        run: >-
          python -m pytest -q tests/test_image_reduce.py tests/test_payload_assets.py
          tests/test_payload_completion.py tests/test_payload_recognition.py
          tests/test_payload_time_text.py
          tests/test_publish_moodle.py
          tests/test_disclosure_mentor_only.py tests/test_moodle_payload_discussion.py
          tests/test_ltct_admin.py
