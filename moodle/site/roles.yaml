# Roles the training system depends on, and their permissions at system context.
#
# Read only by scripts/site_config.py (contract: specs/001-site-config-as-code/contracts/declaration.md).
# Expected permissions = get_default_capabilities(archetype) with `capabilities` laid over them;
# a role with an empty archetype starts with none. `inherit` removes the system-context
# permission. Apply never resets or deletes a role.

roles:
  - shortname: ltcpublisher
    name: LTC curriculum publisher
    description: >-
      Publishes courses from the LTC curriculum repository over the web service.
      Declared in moodle/site/roles.yaml and applied by scripts/site_config.py --
      edit that file rather than this role, so every server gets the same thing.
    archetype: ""   # deliberately none: this account does exactly the publishing job and nothing else
    contextlevels: [system, coursecat, course]   # assignable at system level so one assignment covers every course it creates
    capabilities:
      local/ltuse:publish: allow
      webservice/rest:use: allow            # without it every call fails as an access control exception that reads like a bad token
      moodle/course:create: allow           # publish_moodle.py creates a course on first publish
      moodle/course:update: allow
      moodle/course:view: allow
      moodle/course:viewhiddencourses: allow   # courses are created hidden; the publisher must see its own work to update it
      moodle/course:visibility: allow
      moodle/course:manageactivities: allow    # create_page and create_quiz add modules
      moodle/course:activityvisibility: allow  # ... and hide them
      moodle/course:managefiles: allow
      moodle/course:changesummary: allow
      moodle/question:add: allow               # import_questions writes into the course question bank
      moodle/question:editall: allow
      moodle/question:managecategory: allow
      moodle/question:viewall: allow
      moodle/site:trustcontent: allow          # #3: published pages carry iframe embeds that trusted text keeps
      moodle/course:changelockedcustomfields: allow   # #7: writes ltct_competencies, ltct_target_level (R11)
      moodle/grade:managegradingforms: allow   # spec 012 (R1): upsert_assignment writes the marking guide
      moodle/role:safeoverride: allow          # spec 012: create_page prohibits mod/page:view for student on mentor notes
      moodle/course:managegroups: allow        # spec 012: read-only use; drift reads group ids, no group is written
      moodle/badges:createbadge: allow         # #23: set_course_recognition creates the course badge (spec 013 R1)
      moodle/badges:configuredetails: allow    # ... rewords it in place (R5)
      moodle/badges:configurecriteria: allow   # ... sets its course-completion criterion and activates it
      moodle/badges:configuremessages: allow   # ... sets its award message
      mod/customcert:addinstance: allow        # #23: creates the certificate activity (R7)
      mod/customcert:manage: allow             # ... and copies the site template into it
    why: >-
      The publisher's web-service account (scripts/publish_moodle.py, local_ltuse). The 15
      capabilities are the ones setup_publishing.php used to hard-code; that script now only
      creates the account, service authorisation and token. moodle/site:trustcontent is #3.
      moodle/course:changelockedcustomfields is #7 (spec 004, R11): both course fields are
      locked, and the course web services silently drop a locked field the caller may not
      change.
      Spec 012 (#22, #10) adds three, each reviewed against least privilege: all three are
      course-context capabilities that the editingteacher or manager archetype already holds,
      and the account only reaches the hidden courses it creates. managegradingforms
      (RISK_PERSONAL|XSS) is the only way to write a marking guide. role:safeoverride
      (RISK_SPAM) is the second lock on mentor notes beside visible = 0 (plan, Complexity
      Tracking). It covers only capabilities with no risk bit, which mod/page:view is, so the
      wider role:override (RISK_SPAM|PERSONAL|XSS) is not granted; create_page checks
      safeoverride and refuses a capability with a risk bit. managegroups (RISK_XSS) is a
      write capability granted for a read-only use; it must not be relied on to write groups
      without revisiting this entry.
      The badge and customcert capabilities are #23 (spec 013): the publisher makes
      each delivered course's badge and certificate activity.

  - shortname: user
    archetype: user
    capabilities:
      moodle/badges:viewotherbadges: inherit
    why: >-
      #23 (spec 013 R10, FR-011): a learner's badges are not shown to other learners. The
      capability is granted to the mentor role in the learner's user context (spec 003), and
      managers keep it through their archetype, so the evidence stays visible to those who
      need it.

  - shortname: manager
    archetype: manager
    allowassign: [mentor]   # spec 003 (R6): the site team assigns mentors in a learner's profile
    capabilities:
      moodle/site:trustcontent: allow
    why: >-
      #3 (FR-012): managers keep trusted content, so their edits keep iframe embeds. #11
      (spec 003): a manager may assign the mentor role, which is what offers "Mentor" on a
      learner's "Assign roles relative to this user" page. Admins need no pair.

  - shortname: editingteacher
    archetype: editingteacher
    capabilities:
      moodle/site:trustcontent: inherit
    why: >-
      #3 (FR-012): editing teachers lose trusted content at system context, so content they
      edit in Moodle is cleaned of iframes. Only the publisher and managers keep an iframe.

  - shortname: orgmanager
    name: Organisation manager
    description: >-
      Follows one partner organisation's learners in the courses that organisation is enrolled
      in: the participants page, their profiles and their identity fields, and the course's
      activity and course completion reports, for their own group only. Changes nothing. Comes only through the organisation's managers cohort, by cohort
      sync. Declared in moodle/site/roles.yaml and applied by scripts/site_config.py -- edit
      that file rather than this role.
    archetype: ""   # every capability is managed, so a capability granted by hand shows as drift
    contextlevels: [course]   # assigned only by cohort sync in a course, never per person (R2, FR-012)
    capabilities:
      moodle/course:viewparticipants: allow   # the participants page, filtered to their group (R3)
      moodle/user:viewdetails: allow          # open one of their people's profiles
      moodle/site:viewuseridentity: allow     # the identity fields the site shows, such as email
      report/progress:view: allow             # per-lesson ticks for their own group (R8)
      report/completion:view: allow           # course completion for their own group (R8)
    why: >-
      #8 and #15 (FR-005 to FR-007): one follow-only role for every partner organisation, so
      every manager holds the same permissions (SC-005). It holds no
      moodle/site:accessallgroups, so separate groups keep each organisation apart, and no
      moodle/user:viewalldetails, which reaches every learner site-wide and would show
      teachers-visibility fields such as ltct_role (R2, R5). Nothing is prohibit, so a manager
      who is also a mentor keeps that role's permissions. local_ltuse's profile hook limits
      whose profiles a manager can open (R9). report/progress:view and report/completion:view
      are #7 (spec 004, R8): both reports honour separate groups, so without
      moodle/site:accessallgroups a manager sees only their own group's learners there too.

  - shortname: student
    archetype: student
    capabilities:
      mod/workshop:viewauthornames: inherit   # FR-012a: peers never see who wrote what (R4)
      mod/scheduler:seeotherstudentsbooking: inherit   # spec 011 D4: nobody sees who else booked (R19)
    why: >-
      #22 (spec 012): peer review is anonymous between learners. The student archetype allows
      mod/workshop:viewauthornames by default; removing it at system context hides author
      names in every workshop. Inert until a course has a workshop. #21 (spec 011, D4, FR-008,
      R19): bookings are private. The student archetype allows
      mod/scheduler:seeotherstudentsbooking, which names everyone who booked a slot; removing
      it at system context hides them on every booking page.

  - shortname: teacher          # "Non-editing teacher"; called "Course mentor" in our docs, not renamed in Moodle
    archetype: teacher
    capabilities:
      moodle/site:accessallgroups: inherit    # already absent from the teacher archetype (R3); listed so drift manages it
      # Spec 011 (R19): a mentor manages only their own office-hour slots. All three are
      # already absent from the teacher archetype; listed so a hand grant shows as drift.
      mod/scheduler:manageallappointments: inherit
      mod/scheduler:canscheduletootherteachers: inherit
      mod/scheduler:canseeotherteachersbooking: inherit
    why: >-
      #22 (spec 012): the course-level role that assesses work. Its archetype defaults are what
      FR-010/FR-013 need (assign:grade, workshop allocate/switchphase/overridegrades,
      viewhiddenactivities). Lacking moodle/site:accessallgroups is what keeps a mentor inside
      their organisation's groups (#10). A role with an archetype has only its listed
      capabilities managed, so accessallgroups is declared explicitly (as the archetype
      default, inherit) for drift to catch it being granted by hand.

  - shortname: mentor
    name: Mentor
    description: >-
      Follows the learners assigned to them, across every course they take, for as long as
      the relationship lasts. Changes nothing. Assigned in a learner's own profile
      (Preferences > Assign roles relative to this user), never in a course. Declared in
      moodle/site/roles.yaml and applied by scripts/site_config.py -- edit that file rather
      than this role.
    archetype: ""            # every capability is managed, so one granted by hand shows as drift
    contextlevels: [user]    # a relationship is with a learner, not an enrolment (FR-002)
    capabilities:
      moodle/user:viewdetails: allow                 # open the learner's profile
      moodle/user:viewuseractivitiesreport: allow    # core Grades overview, read only
      local/ltuse:viewmenteeprogress: allow          # the Mentoring page (research R3)
    why: >-
      #11 (spec 003): one mentor role for every partner (FR-001). Every capability is checked
      in the learner's own user context, so it reaches only the learners someone is assigned
      to (FR-005), and every course they join later (FR-004). It holds nothing that writes
      (FR-006), rates a competency or records a level (FR-013); site_config.py validate keeps
      it to this allowlist (research R2). Left out on purpose: moodle/user:viewalldetails
      (hidden profile fields), readuserposts, editprofile. Course feedback is the Course
      mentor role's (teacher, spec 012), not this one's (research R8).
