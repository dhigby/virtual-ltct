name: Site Config

on:
  push:
    paths:
      - 'moodle/site/**'
      - 'moodle/local_ltuse/version.php'
      - 'moodle/REQUIREMENTS.md'
      - 'competencies.yaml'
      - 'scripts/site_config.py'
      - 'tests/test_site_config.py'
      - 'moodle/local_ltuse/classes/**'
      - 'tests/criteria_harness.php'
      - 'scripts/cbc_wording.py'
      - 'outcome-levels.yaml'
      - 'modules/*/README.md'
      - 'tests/test_cbc_wording.py'
      - 'tests/recognition_harness.php'
      - 'tests/calendar_notify_harness.php'
      - 'tests/timezone_notice_harness.php'
      - 'tests/officehours_harness.php'
      - 'tests/booking_notice_harness.php'
      # Spec 006: competency slugs and urls come from the descriptors and mkdocs.yml.
      - 'competencies/**'
      - 'mkdocs.yml'
      - 'moodle/local_ltuse/lang/**'
      - 'tests/pathway_harness.php'
      - 'tests/test_pathway_wording.py'
  pull_request:
    paths:
      - 'moodle/site/**'
      - 'moodle/local_ltuse/version.php'
      - 'moodle/REQUIREMENTS.md'
      - 'competencies.yaml'
      - 'scripts/site_config.py'
      - 'tests/test_site_config.py'
      - 'moodle/local_ltuse/classes/**'
      - 'tests/criteria_harness.php'
      - 'scripts/cbc_wording.py'
      - 'outcome-levels.yaml'
      - 'modules/*/README.md'
      - 'tests/test_cbc_wording.py'
      - 'tests/recognition_harness.php'
      - 'tests/calendar_notify_harness.php'
      - 'tests/timezone_notice_harness.php'
      - 'tests/officehours_harness.php'
      - 'tests/booking_notice_harness.php'
      # Spec 006: competency slugs and urls come from the descriptors and mkdocs.yml.
      - 'competencies/**'
      - 'mkdocs.yml'
      - 'moodle/local_ltuse/lang/**'
      - 'tests/pathway_harness.php'
      - 'tests/test_pathway_wording.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - name: Validate the Moodle site declaration
        run: python scripts/site_config.py validate
      - name: Unit tests for site_config.py and the CBC wording rule
        run: python -m pytest -q tests/test_site_config.py tests/test_cbc_wording.py tests/test_pathway_wording.py
      # local_ltuse's pure completion classes, and the guard that set_course_completion
      # never names core's wipe functions. Needs no Moodle; the runner image ships PHP.
      - name: Completion rule and criteria diff harness
        run: php tests/criteria_harness.php
      # Spec 013: local_ltuse's badge renderer, its wording backstop against cbc_wording.py's
      # own deny patterns (read through Python, so PHP never holds a copy), and the
      # certificate's availability. Runs after setup-python, which the harness calls.
      - name: Recognition harness
        run: php tests/recognition_harness.php
      # Spec 011: local_ltuse's pure decisions for calendar change notices, the time zone
      # notice, the office-hours group sync and the booking messages. Needs no Moodle.
      - name: Events and office-hours harnesses
        run: |
          php tests/calendar_notify_harness.php
          php tests/timezone_notice_harness.php
          php tests/officehours_harness.php
          php tests/booking_notice_harness.php
      # Spec 006: the pathway layout (next course, no course yet, role totals) and who may see
      # whose pathways. Needs no Moodle.
      - name: Pathway harness
        run: php tests/pathway_harness.php
